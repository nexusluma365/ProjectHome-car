[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/home"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/home/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/Learnhowtomakemoneyfromhome"
  to = "/Learn How To Make Money From Home.html"
  status = 200

[[redirects]]
  from = "/Learnhowtomakemoneyfromhome/"
  to = "/Learn How To Make Money From Home.html"
  status = 200

[[redirects]]
  from = "/learnhowtomakemoneyfromhome"
  to = "/Learn How To Make Money From Home.html"
  status = 200

[[redirects]]
  from = "/learnhowtomakemoneyfromhome/"
  to = "/Learn How To Make Money From Home.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
